<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
</style>
</head>
<body>
<img id="creative" alt="">
<script>
const creatives=[
 {src:"assets/360x360.jpg",w:360,h:360},
 {src:"assets/320x410.jpg",w:320,h:410},
 {src:"assets/640x820.jpg",w:640,h:820},
 {src:"assets/640x960.jpg",w:640,h:960},
 {src:"assets/640x1080.jpg",w:640,h:1080},
 {src:"assets/640x1200.jpg",w:640,h:1200},
 {src:"assets/640x1280.jpg",w:640,h:1280},
 {src:"assets/640x1370.jpg",w:640,h:1370}
];
function choose(){
 const r=innerWidth/innerHeight;
 const best=creatives.reduce((a,b)=>Math.abs(b.w/b.h-r)<Math.abs(a.w/a.h-r)?b:a);
 const img=document.getElementById("creative");
 if(!img.src.endsWith(best.src)) img.src=best.src;
}
addEventListener("resize",choose,{passive:true}); choose();
</script>
</body>
</html>
